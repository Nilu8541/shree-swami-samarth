<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shree Swami Samarth Shop</title>

<style>

body{
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
}

.container{
  max-width:500px;
  margin:20px auto;
  background:white;
  padding:15px;
  border-radius:12px;
}

h1{
  text-align:center;
  color:#ff6600;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

.product{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  margin:8px 0;
  background:#fafafa;
  border-radius:8px;
}

.qty{
  display:flex;
  gap:10px;
  align-items:center;
}

.qty button{
  width:35px;
  height:35px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.main-btn{
  width:100%;
  margin-top:10px;
  color:white;
  font-size:16px;
}

.pay{background:#28a745;}
.wa{background:#25D366;}
.pdf{background:#6f42c1;}
.loc{background:#ff6600;}

</style>
</head>

<body>

<div class="container">

<h1>Shree Swami Samarth Shop</h1>

<input id="name" placeholder="नाव">
<input id="phone" placeholder="मोबाईल नंबर">
<input id="address" placeholder="पत्ता">

<!-- PRODUCTS -->

<div id="products"></div>

<h2 id="total">Total: ₹0</h2>

<button class="main-btn pay" onclick="payNow()">UPI Payment</button>

<button class="main-btn wa" onclick="orderWhatsApp()">WhatsApp Order</button>

<button class="main-btn pdf" onclick="downloadInvoice()">Download Invoice</button>

<a href="https://www.google.com/maps/search/?api=1&query=Ganesh+Nagar" target="_blank">
  <button class="main-btn loc">📍 Location पाहा</button>
</a>

</div>

<script>

let products = [

  {id:"sugar",name:"साखर",price:100},
  {id:"rice",name:"तांदूळ",price:80},
  {id:"wheat",name:"गहू",price:60},
  {id:"toor",name:"तूर डाळ",price:140},
  {id:"harbhara",name:"हरभरा डाळ",price:110},
  {id:"moog",name:"मूग डाळ",price:130},
  {id:"oil",name:"तेल",price:200},
  {id:"salt",name:"मीठ",price:40},
  {id:"halad",name:"हळद पावडर",price:30},
  {id:"tikhat",name:"तिखट पावडर",price:50},
  {id:"dhane",name:"धणे पावडर",price:40},
  {id:"masala",name:"गरम मसाला",price:60},
  {id:"tea",name:"चहा पावडर",price:250},
  {id:"coffee",name:"कॉफी",price:300},
  {id:"soap",name:"साबण",price:35},
  {id:"powder",name:"डिटर्जंट पावडर",price:120},
  {id:"shampoo",name:"शॅम्पू",price:5},
  {id:"hairoil",name:"हेअर ऑइल",price:90},
  {id:"paste",name:"टूथपेस्ट",price:55},
  {id:"brush",name:"ब्रश",price:20},
  {id:"agarbatti",name:"अगरबत्ती",price:30},
  {id:"matchbox",name:"माचीस",price:5},
  {id:"biscuit",name:"बिस्किट",price:20},
  {id:"chocolate",name:"चॉकलेट",price:10},
  {id:"noodles",name:"नूडल्स",price:15},
  {id:"wafers",name:"वेफर्स",price:20},
  {id:"drink",name:"कोल्ड ड्रिंक",price:40}

];

let cart = {};

products.forEach(item=>{
  cart[item.id]=0;
});

let productsDiv = document.getElementById("products");

products.forEach(item=>{

  productsDiv.innerHTML += `

  <div class="product">

    <span>${item.name} - ₹${item.price}</span>

    <div class="qty">

      <button onclick="changeQty('${item.id}',-1)">-</button>

      <span id="${item.id}">0</span>

      <button onclick="changeQty('${item.id}',1)">+</button>

    </div>

  </div>

  `;

});

function changeQty(id,val){

  cart[id]+=val;

  if(cart[id]<0){
    cart[id]=0;
  }

  document.getElementById(id).innerText = cart[id];

  updateTotal();
}

function updateTotal(){

  let total = 0;

  products.forEach(item=>{

    total += cart[item.id] * item.price;

  });

  document.getElementById("total").innerText =
  "Total: ₹" + total;
}

function payNow(){

  let total = 0;

  products.forEach(item=>{

    total += cart[item.id] * item.price;

  });

  window.location.href =
  "upi://pay?pa=nileshmandale@axisbank&pn=Shop&am="+total+"&cu=INR";
}

function orderWhatsApp(){

  let name =
  document.getElementById("name").value;

  let phone =
  document.getElementById("phone").value;

  let address =
  document.getElementById("address").value;

  let msg = "🛒 Order Details:%0A%0A";

  msg += "👤 Name: " + name + "%0A";
  msg += "📞 Phone: " + phone + "%0A";
  msg += "🏠 Address: " + address + "%0A%0A";

  products.forEach(item=>{

    if(cart[item.id] > 0){

      msg += item.name + " : " + cart[item.id] + "%0A";

    }

  });

  let total = 0;

  products.forEach(item=>{

    total += cart[item.id] * item.price;

  });

  msg += "%0A💰 Total: ₹" + total;

  window.open(
    "https://wa.me/918530985372?text=" + msg,
    "_blank"
  );
}

function downloadInvoice(){

  let name =
  document.getElementById("name").value;

  let address =
  document.getElementById("address").value;

  let content =
  "Shree Swami Samarth Shop Invoice\n\n";

  content += "Name: " + name + "\n";
  content += "Address: " + address + "\n\n";

  let total = 0;

  products.forEach(item=>{

    if(cart[item.id] > 0){

      content +=
      item.name + " : " +
      cart[item.id] +
      " x ₹" + item.price + "\n";

      total += cart[item.id] * item.price;
    }

  });

  content += "\nTOTAL: ₹" + total;

  let blob = new Blob([content], {type:"text/plain"});

  let a = document.createElement("a");

  a.href = URL.createObjectURL(blob);

  a.download = "invoice.txt";

  a.click();
}

</script>

</body>
</html>
