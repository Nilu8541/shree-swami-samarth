```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Daily Report</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:15px;
}
.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}
h2{
    text-align:center;
}
label{
    font-weight:bold;
    margin-top:10px;
    display:block;
}
input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}
.generate{
    background:#007bff;
    color:#fff;
}
.whatsapp{
    background:#25D366;
    color:#fff;
}
.report{
    margin-top:15px;
    background:#eef5ff;
    padding:15px;
    border-radius:8px;
    white-space:pre-line;
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h2>🚗 Driver Daily Report</h2>

<label>Date</label>
<input type="date" id="date">

<label>Driver Name</label>
<select id="driver">
    <option value="">-- Select Driver --</option>
    <option>Anil</option>
    <option>Pratik</option>
    <option>Yash</option>
</select>

<label>Shift</label>
<select id="shift">
    <option>Day Shift</option>
    <option>Night Shift</option>
</select>

<label>Vehicle Number</label>
<select id="vehicle">
    <option>MH 12 ZE 1879</option>
    <option>MH 12 CE 1234</option>
    <option>MH 12 CW 8541</option>
</select>

<label>Starting KM</label>
<input type="number" id="startkm">

<label>Ending KM</label>
<input type="number" id="endkm">

<label>Total KM</label>
<input type="number" id="totalkm" readonly>

<label>CNG Cost (₹)</label>
<input type="number" id="cng">

<label>Magarpatta Trips</label>
<input type="number" id="magarpatta" value="0">

<label>Kharadi Trips</label>
<input type="number" id="kharadi" value="0">

<label>Remarks</label>
<textarea id="remarks"></textarea>

<button class="generate" onclick="generateReport()">
Generate Report
</button>

<button class="whatsapp" onclick="sendWhatsApp()">
📲 Send to WhatsApp
</button>

<div id="report" class="report"></div>

</div>

<script>

// Auto Date
document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("date").value =
    new Date().toISOString().split("T")[0];
});

// Auto KM Calculation
document.getElementById("startkm").addEventListener("input", calculateKM);
document.getElementById("endkm").addEventListener("input", calculateKM);

function calculateKM() {
    let start = Number(document.getElementById("startkm").value) || 0;
    let end = Number(document.getElementById("endkm").value) || 0;

    document.getElementById("totalkm").value = end - start;
}

// Generate Report
function generateReport() {

    let date = document.getElementById("date").value;
    let driver = document.getElementById("driver").value;
    let shift = document.getElementById("shift").value;
    let vehicle = document.getElementById("vehicle").value;

    let start = Number(document.getElementById("startkm").value) || 0;
    let end = Number(document.getElementById("endkm").value) || 0;
    let totalKm = end - start;

    let cng = Number(document.getElementById("cng").value) || 0;
    let mag = Number(document.getElementById("magarpatta").value) || 0;
    let kha = Number(document.getElementById("kharadi").value) || 0;

    let totalTrips = mag + kha;

    let remarks = document.getElementById("remarks").value;

    let report = `🚗 DRIVER DAILY REPORT

📅 Date: ${date}
👤 Driver: ${driver}
🕒 Shift: ${shift}
🚘 Vehicle: ${vehicle}

📍 Start KM: ${start}
📍 End KM: ${end}
🛣 Total KM: ${totalKm}

⛽ CNG Cost: ₹${cng}

📌 Magarpatta Trips: ${mag}
📌 Kharadi Trips: ${kha}
🚖 Total Trips: ${totalTrips}

📝 Remarks: ${remarks}`;

    let reportBox = document.getElementById("report");
    reportBox.style.display = "block";
    reportBox.textContent = report;
}

// WhatsApp Send
function sendWhatsApp() {

    let report =
    document.getElementById("report").textContent;

    if (!report.trim()) {
        alert("Please Generate Report First");
        return;
    }

    let phone = "918530985372";

    let url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(report);

    window.open(url, "_blank");
}
</script>

</body>
</html>
```
