<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>श्री स्वामी समर्थ Shop</title>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
}

.container{
  max-width:500px;
  margin:20px auto;
  background:white;
  padding:15px;
  border-radius:12px;
}

h1{
  text-align:center;
  color:#ff6600;
}

.product{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#fafafa;
  margin:8px 0;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
}

.add{
  background:#007bff;
  color:white;
}

.wa{
  background:#25D366;
  color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>श्री स्वामी समर्थ</h1>

<p style="text-align:center;">Products निवडा आणि ऑर्डर करा</p>

<div class="product">
  <span>साखर - ₹100</span>
  <button class="add" onclick="add('साखर',100)">Add</button>
</div>

<div class="product">
  <span>पावडर - ₹150</span>
  <button class="add" onclick="add('पावडर',150)">Add</button>
</div>

<div class="product">
  <span>तेल - ₹200</span>
  <button class="add" onclick="add('तेल',200)">Add</button>
</div>

<div class="product">
  <span>साबण - ₹50</span>
  <button class="add" onclick="add('साबण',50)">Add</button>
</div>

<div class="product">
  <span>छोटा - ₹80</span>
  <button class="add" onclick="add('छोटा',80)">Add</button>
</div>

<h3 id="total">Total: ₹0</h3>

<button class="wa" onclick="orderWhatsApp()">
WhatsApp वर Order करा
</button>

</div>

<script>

let cart = [];
let total = 0;

function add(name, price){
  cart.push(name + " - ₹" + price);
  total += price;
  document.getElementById("total").innerText = "Total: ₹" + total;
}

function orderWhatsApp(){
  let msg = "नमस्कार, मला हे products हवे आहेत:%0A" + cart.join("%0A") + "%0ATotal: ₹" + total;

  let url = "https://wa.me/918530985372?text=" + msg;

  window.open(url, "_blank");
}

</script>

</body>
</html>
